name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (macOS 15)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain info
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Run Swift tests
        run: swift test

      - name: Build release (arm64)
        run: swift build -c release --arch arm64

      - name: Build release (x86_64)
        run: swift build -c release --arch x86_64

      - name: Verify app bundling (arm64 & x86_64)
        run: |
          ./scripts/bundle_app.sh release arm64
          ./scripts/bundle_app.sh release x86_64
